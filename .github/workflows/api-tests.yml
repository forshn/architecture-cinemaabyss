name: API Tests

on:
  push:
    branches: [ main, feature/Cinema  ]
    paths:
      - 'src/**'
      - 'docker-compose.yml'
      - 'tests/postman/**'
      - '.github/workflows/api-tests.yml'
  pull_request:
    branches: [ main, feature/Cinema ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run tests against'
        required: true
        default: 'docker'
        type: choice
        options:
          - docker
          - local
      test_folder:
        description: 'Test folder to run (leave empty for all)'
        required: false
        type: string

jobs:
  api-tests:
    name: Run API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create CI docker-compose override (use GHCR images)
        run: |
          cat > docker-compose.ci.override.yml <<'YAML'
          services:
            monolith:
              image: ghcr.io/${{ github.repository }}/monolith:latest
              build: null
            movies-service:
              image: ghcr.io/${{ github.repository }}/movies-service:latest
              build: null
            events-service:
              image: ghcr.io/${{ github.repository }}/events-service:latest
              build: null
            proxy-service:
              image: ghcr.io/${{ github.repository }}/proxy-service:latest
              build: null
          YAML

      - name: Start services (compose up)
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.override.yml up -d --no-build
          docker compose ps

      - name: Wait for HTTP health
        uses: Jtalk/url-health-check-action@v3
        with:
          url: |
            http://localhost:8080/health
            http://localhost:8081/api/movies/health
            http://localhost:8082/actuator/health
            http://localhost:8000/actuator/health
          max-attempts: 60
          retry-delay: 5s
          timeout: 5s

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tests/postman/package-lock.json

      - name: Install dependencies
        working-directory: tests/postman
        run: npm ci

      - name: Run API tests (local)
        working-directory: tests/postman
        run: npm run test:local

      - name: Show compose logs (on failure)
        if: failure()
        run: docker compose logs --no-color

      - name: Stop services
        if: always()
        run: docker compose down -v