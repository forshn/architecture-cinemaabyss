name: API Tests

on:
  push:
    branches: [ main, feature/Cinema  ]
    paths:
      - 'src/**'
      - 'docker-compose.yml'
      - 'tests/postman/**'
      - '.github/workflows/api-tests.yml'
  pull_request:
    branches: [ main, feature/Cinema  ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run tests against'
        required: true
        default: 'docker'
        type: choice
        options:
          - docker
          - local
      test_folder:
        description: 'Test folder to run (leave empty for all)'
        required: false
        type: string

jobs:
  api-tests:
    name: Run API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create CI docker-compose override (use GHCR images)
        run: |
          cat > docker-compose.ci.override.yml <<'YAML'
          services:
            monolith:
              image: ghcr.io/${{ github.repository }}/monolith:latest
              build: null
            movies-service:
              image: ghcr.io/${{ github.repository }}/movies-service:latest
              build: null
            events-service:
              image: ghcr.io/${{ github.repository }}/events-service:latest
              build: null
            proxy-service:
              image: ghcr.io/${{ github.repository }}/proxy-service:latest
              build: null
          YAML

      - name: Start services (infra first, then apps)
        run: |
          # Start infra
          docker compose up -d postgres zookeeper kafka
          if docker compose wait --help >/dev/null 2>&1; then
            docker compose wait postgres || true
          else
            for i in {1..30}; do
              if docker compose exec -T postgres pg_isready -U postgres; then
                break
              fi
              sleep 2
            done
          fi
          # Start apps from GHCR images (no build)
          docker compose -f docker-compose.yml -f docker-compose.ci.override.yml up -d --no-build monolith movies-service
          docker compose -f docker-compose.yml -f docker-compose.ci.override.yml up -d --no-build events-service proxy-service
          docker compose ps

      - name: Wait for HTTP health
        run: |
          set -e
          endpoints=(
            "http://localhost:8080/health"
            "http://localhost:8081/api/movies/health"
            "http://localhost:8082/actuator/health"
            "http://localhost:8000/actuator/health"
          )
          for url in "${endpoints[@]}"; do
            echo "Waiting for $url"
            ok=false
            for i in {1..60}; do
              if curl -fsS "$url" >/dev/null; then
                echo "OK: $url"
                ok=true
                break
              fi
              echo "Not ready yet ($i), retry in 5s"
              sleep 5
            done
            if [ "$ok" != true ]; then
              echo "ERROR: $url did not become healthy in time"
              docker compose logs --no-color || true
              exit 1
            fi
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tests/postman/package-lock.json

      - name: Install dependencies
        working-directory: tests/postman
        run: npm ci

      - name: Run API tests (local)
        working-directory: tests/postman
        run: npm run test:local

      - name: Show compose logs (on failure)
        if: failure()
        run: docker compose logs --no-color

      - name: Stop services
        if: always()
        run: docker compose down -v